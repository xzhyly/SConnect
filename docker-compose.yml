version: '3.8'

services:
  app:
    build: .
    container_name: scholarconnect_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: scholarconnect_db
    restart: always
    environment:
      MYSQL_DATABASE: scholarconnect
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: scholarconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mock-api:
    build: ./mock-api
    container_name: scholarconnect_mockapi
    restart: unless-stopped
    ports:
      - "8080:8080"

  adminer:
    image: adminer
    container_name: scholarconnect_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  mysql-data: