version: '3.8'

services:
  app:
    build: .
    container_name: scholarconnect_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: scholarconnect_db
    restart: always
    environment:
      MYSQL_DATABASE: scholarconnect
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: scholarconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-api:
    build: ./mock-api
    container_name: scholarconnect_mockapi
    ports:
      - "8080:8080"

volumes:
  mysql-data: